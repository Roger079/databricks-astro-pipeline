resources:
  jobs:
    daily_orchestration:
      name: Astro Taco Bueno daily
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: '0 0 6 * * ?'
        timezone_id: America/Monterrey
        pause_status: PAUSED
      tasks:
        - task_key: ingest
          max_retries: 1
          min_retry_interval_millis: 60000
          timeout_seconds: 7200
          notebook_task:
            notebook_path: ../../notebooks/01_ingest.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              source_table: ${var.source_table}
              amount_grain: ${var.amount_grain}
        - task_key: transform
          depends_on:
            - task_key: ingest
          pipeline_task:
            pipeline_id: ${resources.pipelines.taco_pipeline.id}
            full_refresh: false
          timeout_seconds: 14400
        - task_key: validate
          depends_on:
            - task_key: transform
          notebook_task:
            notebook_path: ../../notebooks/03_validate.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
          timeout_seconds: 3600
        - task_key: analysis
          depends_on:
            - task_key: validate
          notebook_task:
            notebook_path: ../../notebooks/04_analysis.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
          timeout_seconds: 3600
