# Demo-only orchestration; included by the root bundle's resources/jobs glob.
targets:
  demo:
    resources:
      jobs:
        seed_demo:
          name: Astro Taco Bueno synthetic demo seed
          max_concurrent_runs: 1
          tasks:
            - task_key: seed
              notebook_task:
                notebook_path: ../../notebooks/00_demo_source.py
                base_parameters:
                  catalog: ${var.catalog}
                  schema: ${var.schema}
              timeout_seconds: 1800
