resources:
  pipelines:
    taco_pipeline:
      name: Astro Taco Bueno ${bundle.target} transformations
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      continuous: false
      edition: ADVANCED
      libraries:
        - glob:
            include: ../../src/transformations/**
      configuration:
        astro.catalog: ${var.catalog}
        astro.schema: ${var.schema}
