bundle:
  name: astro-taco-bueno
include:
  - resources/jobs/*.yml
  - resources/pipelines/*.yml
variables:
  catalog:
    default: workspace
    description: Existing Unity Catalog catalog
  schema:
    default: astro_taco_main_real
  source_table:
    default: workspace.default.tb_daily_tld_01_01_2026_m
    description: Real two-day POS source (Dec 31, 2025 and Jan 1, 2026)
  amount_grain:
    default: check
    description: Ticket-level fields verified across all 40306 real tickets
  team_principals:
    default: a01236573@tec.mx,a00842807@tec.mx,a01381456@tec.mx
    description: Workspace team members granted access to new project schemas
permissions:
  - user_name: a01236573@tec.mx
    level: CAN_MANAGE
  - user_name: a00842807@tec.mx
    level: CAN_MANAGE
  - user_name: a01381456@tec.mx
    level: CAN_MANAGE
workspace:
  host: https://dbc-cfb7f93a-b497.cloud.databricks.com
targets:
  dev:
    default: true
    mode: development
  demo:
    mode: development
    variables:
      schema: astro_taco_main_demo
      source_table: ${var.catalog}.${var.schema}.demo_pos_source
      amount_grain: check
    resources:
      jobs:
        seed_demo:
          name: Astro Taco Bueno synthetic demo seed
          max_concurrent_runs: 1
          tasks:
            - task_key: seed
              notebook_task:
                notebook_path: notebooks/00_demo_source.py
                base_parameters:
                  catalog: ${var.catalog}
                  schema: ${var.schema}
              timeout_seconds: 1800
